<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Vault - Web Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- EXIF 분석 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex overflow-hidden font-sans">

    <!-- 좌측 사이드바 -->
    <aside class="w-80 bg-slate-950/80 backdrop-blur-md border-r border-slate-800/80 flex flex-col justify-between z-10">
        <div>
            <div class="p-6 border-b border-slate-800/80 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <div>
                        <h1 class="font-bold text-base text-white tracking-tight">Photo Vault</h1>
                        <p class="text-[11px] text-slate-400 font-medium">GitHub Pages Live App</p>
                    </div>
                </div>
            </div>

            <div class="p-4">
                <div class="flex items-center justify-between px-2 mb-3">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">분류된 보관함</span>
                    <span id="total-folders-count" class="text-[11px] text-indigo-400 font-semibold bg-indigo-500/10 px-2 py-0.5 rounded-full border border-indigo-500/20">0개 폴더</span>
                </div>
                <div id="folder-list" class="space-y-1.5 overflow-y-auto max-h-[calc(100vh-220px)] pr-1"></div>
            </div>
        </div>
        <div class="p-4 border-t border-slate-800/80 bg-slate-950/40 text-center">
            <span class="inline-flex items-center gap-1.5 text-xs text-slate-400">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Client Engine Ready
            </span>
        </div>
    </aside>

    <!-- 메인 영역 -->
    <main class="flex-1 flex flex-col overflow-y-auto bg-slate-900">
        <div class="p-8 max-w-7xl w-full mx-auto space-y-8">
            <!-- 드롭존 -->
            <section class="relative">
                <div id="drop-zone" class="group border-2 border-dashed border-slate-700/80 hover:border-indigo-500/80 bg-slate-800/30 hover:bg-slate-800/60 rounded-2xl p-8 text-center cursor-pointer transition-all duration-300 shadow-xl backdrop-blur-sm">
                    <div class="w-14 h-14 bg-indigo-600/10 border border-indigo-500/20 group-hover:scale-110 group-hover:bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-4 transition-all duration-300">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    </div>
                    <h3 class="text-base font-semibold text-white group-hover:text-indigo-300 transition-colors">사진을 여기에 드래그하여 업로드하세요</h3>
                    <p class="text-xs text-slate-400 mt-1">웹 브라우저에서 메타데이터를 직접 분석하여 날짜별로 정돈합니다.</p>
                    <input type="file" id="file-input" multiple accept="image/*" class="hidden">
                </div>
            </section>

            <!-- 갤러리 영역 -->
            <section class="bg-slate-800/40 rounded-2xl p-6 border border-slate-800 shadow-xl">
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-5 mb-6">
                    <div>
                        <h2 id="current-folder-title" class="text-lg font-bold text-white tracking-tight">사진을 업로드해주세요</h2>
                        <p id="current-folder-sub" class="text-xs text-slate-400 mt-0.5">보관함 폴더를 클릭하면 해당 날짜 사진을 보여줍니다.</p>
                    </div>
                    <span id="photo-count-badge" class="hidden px-3 py-1 bg-slate-700/50 text-slate-300 rounded-full text-xs font-medium border border-slate-600/50">0개 항목</span>
                </div>

                <div id="photo-gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
            </section>
        </div>
    </main>

    <script>
        const photosByDate = {}; // 날짜별 데이터 저장소
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => e.preventDefault()));
        dropZone.addEventListener('drop', e => processFiles(e.dataTransfer.files));
        fileInput.addEventListener('change', e => processFiles(e.target.files));

        function processFiles(files) {
            Array.from(files).forEach(file => {
                EXIF.getData(file, function() {
                    const dateTime = EXIF.getTag(this, "DateTimeOriginal");
                    let dateKey = 'unknown_Date';
                    
                    if (dateTime) {
                        const parts = dateTime.split(" ")[0].split(":");
                        if (parts.length === 3) dateKey = `${parts[0]}-${parts[1]}`;
                    }

                    if (!photosByDate[dateKey]) photosByDate[dateKey] = [];
                    
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        photosByDate[dateKey].push({ name: file.name, url: e.target.result });
                        updateSidebar();
                        renderGallery(dateKey);
                    };
                    reader.readAsDataURL(file);
                });
            });
        }

        function updateSidebar() {
            const list = document.getElementById('folder-list');
            const keys = Object.keys(photosByDate);
            document.getElementById('total-folders-count').textContent = `${keys.length}개 폴더`;
            list.innerHTML = '';

            keys.forEach(key => {
                list.innerHTML += `
                    <button onclick="renderGallery('${key}')" class="w-full text-left p-3 rounded-xl hover:bg-slate-800/80 flex items-center justify-between group">
                        <div class="flex items-center space-x-2.5">
                            <span>📂</span>
                            <span class="text-xs font-medium text-slate-300 group-hover:text-white">${key}</span>
                        </div>
                        <span class="text-[11px] font-semibold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded-md">${photosByDate[key].length}장</span>
                    </button>
                `;
            });
        }

        function renderGallery(key) {
            document.getElementById('current-folder-title').textContent = `📂 ${key}`;
            const gallery = document.getElementById('photo-gallery');
            const photos = photosByDate[key] || [];
            
            document.getElementById('photo-count-badge').classList.remove('hidden');
            document.getElementById('photo-count-badge').textContent = `${photos.length}개 항목`;
            gallery.innerHTML = '';

            photos.forEach(item => {
                gallery.innerHTML += `
                    <div class="group relative aspect-square bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-lg">
                        <img src="${item.url}" alt="${item.name}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 flex items-end p-2.5 transition-opacity">
                            <p class="text-[11px] text-slate-200 truncate w-full text-center">${item.name}</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
